version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wonderful_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tcl21091
      POSTGRES_DB: wonderful_voice_assistant
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wonderful_network

volumes:
  postgres_data:
    driver: local

networks:
  wonderful_network:
    driver: bridge